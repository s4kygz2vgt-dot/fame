<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18131f"><title>FAME — your celebrity life</title>
<style>
:root{--bg:#100d15;--panel:#1b1622;--panel2:#241d2d;--text:#f8f3fb;--muted:#b9adbf;--pink:#ff6fb2;--purple:#b69cff;--line:#382d42;--good:#9ce6c0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#2a1934 0,#100d15 48%);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer;border:0;color:var(--text);background:var(--panel2);border-radius:12px;padding:10px 13px}button:active{transform:scale(.98)}.app{max-width:1080px;margin:auto;padding:16px 14px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.logo{font-size:27px;font-weight:950;letter-spacing:2px;background:linear-gradient(90deg,var(--pink),var(--purple));color:transparent;background-clip:text}.tag{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.stat{background:#1a1421dd;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.nav{display:flex;gap:7px;overflow:auto;padding:4px 0 12px;margin-bottom:8px}.nav button{white-space:nowrap;border:1px solid var(--line);background:#191420}.nav button.active{background:linear-gradient(120deg,#7f3974,#55418a);border-color:#a76ca9}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:16px}.panel,.post,.profile-card{background:#1b1622ed;border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:13px}.section-title{font-weight:800;font-size:18px;margin:2px 0 12px}.muted{color:var(--muted)}.stories{display:flex;gap:12px;overflow:auto;padding:3px 0 12px}.story{flex:0 0 68px;text-align:center;font-size:12px}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;margin:0 auto 5px;background:linear-gradient(140deg,#ff83bd,#8868e8);font-size:23px;border:2px solid #ef9bdb}.avatar.you{background:linear-gradient(140deg,#e4a2ff,#6b58b7)}.composer textarea,.composer input,.field{width:100%;background:#110e16;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px;outline:none}.composer textarea{resize:vertical;min-height:72px}.composer-actions{display:flex;gap:8px;margin-top:8px;align-items:center}.primary{background:linear-gradient(120deg,#e451a2,#8058db);font-weight:750}.pill{font-size:11px;padding:4px 8px;border-radius:20px;background:#39263f;color:#ffd0e9}.post-head{display:flex;align-items:center;gap:9px}.post-head .avatar{width:40px;height:40px;font-size:20px;flex-shrink:0}.post-name{font-weight:750}.post-time{font-size:11px;color:var(--muted)}.post-text{margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.post-image{width:100%;max-height:350px;object-fit:cover;border-radius:13px;margin-bottom:8px;background:#251b2d}.post-actions{display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}.post-actions button{padding:7px 10px;font-size:13px}.post-actions button.liked{color:#ff8dbf;background:#47213c}.side-stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.celebrity{display:flex;align-items:center;gap:10px;padding:8px 0}.celebrity .avatar{margin:0;width:40px;height:40px;flex-shrink:0}.smallbtn{font-size:12px;padding:7px 9px;margin-left:auto}.dmrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border-bottom:1px solid var(--line);border-radius:0;padding:10px 2px}.dmrow .avatar{margin:0;flex-shrink:0}.chatbox{display:flex;flex-direction:column;gap:9px;min-height:240px;max-height:48vh;overflow:auto;padding:10px 0}.bubble{max-width:85%;padding:10px 12px;border-radius:14px;background:#30263a;align-self:flex-start;white-space:pre-wrap}.bubble.me{background:#673a72;align-self:flex-end}.chat-send{display:flex;gap:8px}.chat-send input{flex:1;min-width:0}.event{display:flex;gap:12px;align-items:flex-start}.event-date{background:#3d2949;border-radius:12px;padding:10px;text-align:center;min-width:55px}.event-date b{display:block;font-size:20px}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#f8f3fb;color:#17101c;padding:10px 15px;border-radius:12px;box-shadow:0 8px 30px #0007;z-index:5;max-width:90%;display:none}.bottomnav{display:none}.empty{text-align:center;padding:30px 12px;color:var(--muted)}.levelbar{height:7px;background:#3b3044;border-radius:8px;overflow:hidden;margin-top:8px}.levelbar div{height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));width:35%}.comment{font-size:13px;margin:8px 0;padding:8px;background:#15111b;border-radius:10px}.hide{display:none!important}.notice{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:740px){.app{padding:12px 11px 95px}.layout{display:block}.side{display:none}.stats{gap:5px}.stat{padding:8px 3px}.stat b{font-size:18px}.stat span{font-size:10px}.logo{font-size:24px}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:4;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom));background:#17121eeF;border-top:1px solid var(--line);backdrop-filter:blur(14px)}.bottomnav button{background:transparent;padding:7px 8px;font-size:12px}.bottomnav button.active{color:var(--pink)}.panel,.post{padding:13px}.top .tag{display:none}}
</style></head>
<body><div class="app">
<header class="top"><div><div class="logo">FAME ✦</div><div class="tag">your life, your spotlight</div></div><button id="resetBtn" title="Spiel zurücksetzen">↻ Neustart</button></header>
<div class="stats"><div class="stat"><b id="followers">128</b><span>Follower</span></div><div class="stat"><b id="aura">42</b><span>✨ Aura</span></div><div class="stat"><b id="humor">35</b><span>😂 Humor</span></div><div class="stat"><b id="rep">18</b><span>💜 Reputation</span></div></div>
<div class="nav" id="nav"><button class="active" data-tab="feed">🏠 Feed</button><button data-tab="discover">🔎 Entdecken</button><button data-tab="dms">💌 DMs</button><button data-tab="stories">⭕ Stories</button><button data-tab="events">🎟️ Events</button><button data-tab="profile">👤 Profil</button></div>
<div class="layout"><main id="main"></main><aside class="side"><div class="panel"><div class="section-title">Dein Aufstieg ✦</div><div class="side-stat"><span>Level</span><b id="level">2 — Rising Star</b></div><div class="side-stat"><span>Posts</span><b id="postCount">0</b></div><div class="side-stat"><span>Kontakte</span><b id="contactCount">0</b></div><div class="levelbar"><div id="levelbar"></div></div><div class="notice">Sammle Aura und Follower, um im Fame-Level aufzusteigen.</div></div><div class="panel"><div class="section-title">People to know</div><div id="sideCelebs"></div></div><div class="panel"><div class="section-title">✨ Tages-Challenge</div><p class="muted" id="challenge">Poste etwas und sammle Reaktionen.</p><button class="primary" onclick="setTab('feed')">Challenge starten</button></div></aside></div>
</div><div class="bottomnav" id="bottomnav"><button class="active" data-tab="feed">🏠<br>Feed</button><button data-tab="discover">🔎<br>Entdecken</button><button data-tab="dms">💌<br>DMs</button><button data-tab="events">🎟️<br>Events</button><button data-tab="profile">👤<br>Profil</button></div><div class="toast" id="toast"></div>
<script>
const celebs=[
 {id:'olivia',name:'Olivia Rodrigo',emoji:'💜',bio:'Singer-songwriter · SOUR / GUTS',style:'music'},
 {id:'drew',name:'Drew Starkey',emoji:'🎬',bio:'Actor · Outer Banks',style:'film'},
 {id:'jenna',name:'Jenna Ortega',emoji:'🖤',bio:'Actor · Wednesday',style:'film'},
 {id:'sabrina',name:'Sabrina Carpenter',emoji:'💋',bio:'Pop star · Short n’ Sweet',style:'music'},
 {id:'central',name:'Central Cee',emoji:'🎧',bio:'Rapper · UK rap',style:'music'},
 {id:'billie',name:'Billie Eilish',emoji:'🕷️',bio:'Singer · alternative pop',style:'music'},
 {id:'tom',name:'Tom Holland',emoji:'🕸️',bio:'Actor · Spider-Man',style:'film'},
 {id:'paul',name:'Paul Mescal',emoji:'🎭',bio:'Actor · film & theatre',style:'film'}
];
const starterPosts=[
 {id:1,author:'olivia',name:'Olivia Rodrigo',emoji:'💜',text:'studio days lately 💜 new ideas are always happening',time:'12 min',likes:8421,comments:['this era already has me excited 😭','you never miss'],liked:false,verified:true},
 {id:2,author:'drew',name:'Drew Starkey',emoji:'🎬',text:'long day on set. good people, good memories.',time:'38 min',likes:5932,comments:['hope you got some rest!'],liked:false,verified:true},
 {id:3,author:'jenna',name:'Jenna Ortega',emoji:'🖤',text:'black coffee and a very long script. that’s the post.',time:'1 h',likes:12450,comments:['the mood honestly','🖤🖤'],liked:false,verified:true}
];
let state={followers:128,aura:42,humor:35,rep:18,posts:[],followed:[],likedPosts:[],joinedEvents:[],messages:{},myName:'You',myBio:'just figuring out this fame thing ✦',nextId:10,tab:'feed',selectedChat:null,comments:{},storySeen:[]};
function load(){try{const x=JSON.parse(localStorage.getItem('fameGameV1'));if(x)state={...state,...x}}catch(e){}}
function save(){try{localStorage.setItem('fameGameV1',JSON.stringify(state))}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',2300)}
function getCeleb(id){return celebs.find(c=>c.id===id)||{id:'you',name:state.myName,emoji:'✨',bio:state.myBio}}
function allPosts(){return [...state.posts,...starterPosts]}
function stats(){document.getElementById('followers').textContent=fmt(state.followers);document.getElementById('aura').textContent=fmt(state.aura);document.getElementById('humor').textContent=fmt(state.humor);document.getElementById('rep').textContent=fmt(state.rep);document.getElementById('postCount').textContent=state.posts.length;document.getElementById('contactCount').textContent=state.followed.length;let lv=Math.floor(state.aura/100)+1;document.getElementById('level').textContent=lv+' — '+(lv<3?'Rising Star':lv<6?'It Girl / It Boy':'Global Icon');document.getElementById('levelbar').style.width=(state.aura%100)+'%';document.getElementById('challenge').textContent=state.posts.length?'Poste noch einmal, um deine Community zu vergrößern.':'Poste etwas und sammle Reaktionen.'}
function fmt(n){return n>=1000?(n/1000).toFixed(1).replace('.',',')+'k':n}
function avatar(c,cls=''){return `<div class="avatar ${cls}">${esc(c.emoji||'✨')}</div>`}
function navSet(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab))}
function setTab(tab){state.tab=tab;state.selectedChat=tab==='dms'?(state.selectedChat||'olivia'):state.selectedChat;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function postCard(p){let author=p.author==='you'?{name:state.myName,emoji:'✨',id:'you'}:getCeleb(p.author);let liked=p.liked||state.likedPosts.includes(p.id);let comments=state.comments[p.id]||p.comments||[];return `<article class="post"><div class="post-head">${avatar(author)}<div style="flex:1;min-width:0"><div class="post-name">${esc(p.name||author.name)} ${p.verified?'<span style="color:#a995ff">✓</span>':''} ${p.author==='you'?'<span class="pill">DU</span>':''}</div><div class="post-time">@${esc((p.name||author.name).toLowerCase().replace(/\s/g,''))} · ${esc(p.time||'gerade eben')}</div></div><button class="smallbtn" onclick="toast('Post-Menü geöffnet ✦')">•••</button></div><div class="post-text">${esc(p.text)}</div>${p.image?`<img class="post-image" src="${esc(p.image)}" alt="Dein Post-Bild">`:''}<div class="post-actions"><button class="${liked?'liked':''}" onclick="likePost(${p.id})">${liked?'♥':'♡'} ${fmt((p.likes||0)+(liked&&!p.liked?1:0))}</button><button onclick="commentPost(${p.id})">💬 ${comments.length}</button><button onclick="repost(${p.id})">🔁 Repost</button><button onclick="toast('Link kopiert (Spiel-Demo)')">↗ Teilen</button></div>${comments.length?`<div class="comment"><b>${esc(comments[0].split(':')[0])}</b> ${esc(comments[0].includes(':')?comments[0].split(':').slice(1).join(':'):comments[0])}</div>`:''}</article>`}
function composer(){return `<div class="panel composer"><div class="section-title">Was geht bei dir? ✨</div><textarea id="postText" maxlength="500" placeholder="Drop your update... Was passiert gerade in deinem Leben?"></textarea><div class="composer-actions"><button onclick="addPost()" class="primary">＋ Posten</button><button onclick="addPhotoMock()">🖼️ Foto</button><span class="muted" style="font-size:12px;margin-left:auto">+ Aura für Posts</span></div><div class="notice">Demo-Spiel: Fotos können über eine Bild-URL ergänzt werden.</div></div>`}
function storiesStrip(){return `<div class="panel"><div class="section-title">Stories <span class="muted" style="font-size:12px;font-weight:400">· 24 h</span></div><div class="stories"><div class="story" onclick="makeStory()">${avatar({emoji:'＋'},'you')}Deine Story</div>${celebs.slice(0,7).map(c=>`<div class="story" onclick="viewStory('${c.id}')">${avatar(c)}${esc(c.name.split(' ')[0])}</div>`).join('')}</div></div>`}
function renderFeed(){return `${storiesStrip()}${composer()}<div class="section-title">Für dich</div>${allPosts().map(postCard).join('')}`}
function renderDiscover(){return `<div class="panel"><div class="section-title">Entdecke die Szene ✦</div><p class="muted">Folge Leuten, knüpfe Kontakte und bau dir deinen eigenen Celebrity-Circle auf.</p></div>${celebs.map(c=>`<div class="panel celebrity">${avatar(c)}<div style="flex:1"><b>${esc(c.name)} <span style="color:#a995ff">✓</span></b><div class="muted" style="font-size:12px">${esc(c.bio)}</div></div><button class="smallbtn ${state.followed.includes(c.id)?'':'primary'}" onclick="toggleFollow('${c.id}')">${state.followed.includes(c.id)?'✓ Folgt':'＋ Folgen'}</button><button class="smallbtn" onclick="openChat('${c.id}')">DM</button></div>`).join('')}`}
function renderDms(){if(state.selectedChat){let c=getCeleb(state.selectedChat),msgs=state.messages[c.id]||[];return `<div class="panel"><button onclick="state.selectedChat=null;save();render()">← Alle Chats</button><div class="post-head" style="margin-top:14px">${avatar(c)}<div><b>${esc(c.name)} ${c.id!=='you'?'<span style="color:#a995ff">✓</span>':''}</b><div class="muted" style="font-size:12px">${c.id==='you'?'Notizen': 'Fiktiver Chat · Spielcharakter'}</div></div></div><div class="notice">Die Antworten sind erfunden und stammen nicht von den echten Personen.</div><div class="chatbox" id="chatbox">${msgs.length?msgs.map(m=>`<div class="bubble ${m.from==='me'?'me':''}">${esc(m.text)}</div>`).join(''):'<div class="empty">Schreib die erste Nachricht 👀</div>'}</div><div class="chat-send"><input id="dmText" class="field" placeholder="Nachricht schreiben…" maxlength="300" onkeydown="if(event.key==='Enter')sendDM()"><button class="primary" onclick="sendDM()">Senden</button></div></div>`}return `<div class="panel"><div class="section-title">Deine DMs 💌</div><p class="muted">Schreib deinen Lieblingsstars im Spiel. Antworten sind fiktive Simulationen.</p>${[...state.followed,...celebs.filter(c=>!state.followed.includes(c.id)).map(c=>c.id)].map(id=>{let c=getCeleb(id),m=state.messages[id]||[];return `<button class="dmrow" onclick="openChat('${id}')">${avatar(c)}<span style="flex:1;text-align:left"><b>${esc(c.name)}</b><br><span class="muted" style="font-size:12px">${esc(m.length?m[m.length-1].text:'Schreib eine Nachricht…')}</span></span><span>›</span></button>`}).join('')}</div>`}
function renderStories(){return `<div class="panel"><div class="section-title">Stories ⭕</div><p class="muted">Tippe auf eine Story, um sie anzusehen. Du kannst auch deine eigene Story posten.</p><button class="primary" onclick="makeStory()">＋ Eigene Story posten</button></div>${celebs.map(c=>`<div class="panel celebrity">${avatar(c)}<div style="flex:1"><b>${esc(c.name)}</b><div class="muted" style="font-size:12px">${state.storySeen.includes(c.id)?'Angesehen':'Neue Story · Spielinhalt'}</div></div><button class="smallbtn" onclick="viewStory('${c.id}')">Ansehen</button></div>`).join('')}${state.storySeen.includes('you')?'<div class="panel">✨ Deine Story ist online!</div>':''}`}
const events=[{id:'premiere',day:'18',month:'OKT',title:'Film-Premiere in Los Angeles',desc:'Red carpet, cameras, afterparty.',reward:24,emoji:'🎬'},{id:'studio',day:'22',month:'OKT',title:'Private Studio Session',desc:'Musik hören und neue Leute treffen.',reward:18,emoji:'🎧'},{id:'fashion',day:'26',month:'OKT',title:'Fashion Week Afterparty',desc:'Outfits, Fotos und jede Menge Gossip.',reward:30,emoji:'✨'},{id:'charity',day:'02',month:'NOV',title:'Charity Gala',desc:'Ein Abend für einen guten Zweck.',reward:22,emoji:'💜'}];
function renderEvents(){return `<div class="panel"><div class="section-title">Events & Einladungen 🎟️</div><p class="muted">Nimm an Events teil, sammle Aura und lerne neue Leute kennen.</p></div>${events.map(e=>`<div class="panel event"><div class="event-date"><span>${e.month}</span><b>${e.day}</b></div><div style="flex:1"><div class="section-title" style="font-size:16px;margin:0 0 4px">${e.emoji} ${e.title}</div><p class="muted" style="margin:0 0 8px">${e.desc}</p><span class="pill">+${e.reward} Aura</span></div><button class="smallbtn ${state.joinedEvents.includes(e.id)?'':'primary'}" onclick="joinEvent('${e.id}')">${state.joinedEvents.includes(e.id)?'Dabei ✓':'Zusagen'}</button></div>`).join('')}`}
function renderProfile(){return `<div class="panel" style="text-align:center;padding:25px 15px">${avatar({emoji:'✨'},'you')}<h2 style="margin:8px 0 2px">${esc(state.myName)}</h2><div class="muted">@yourfamejourney</div><p>${esc(state.myBio)}</p><button onclick="editProfile()">✎ Profil bearbeiten</button></div><div class="panel"><div class="section-title">Deine Stats</div><div class="side-stat"><span>Follower</span><b>${fmt(state.followers)}</b></div><div class="side-stat"><span>Aura</span><b>${fmt(state.aura)}</b></div><div class="side-stat"><span>Humor</span><b>${fmt(state.humor)}</b></div><div class="side-stat"><span>Reputation</span><b>${fmt(state.rep)}</b></div><div class="side-stat"><span>Eigene Posts</span><b>${state.posts.length}</b></div></div><div class="section-title">Deine Posts</div>${state.posts.length?state.posts.map(postCard).join(''):'<div class="panel empty">Hier ist es noch ruhig. Poste etwas, damit dein Profil lebendig wird. ✨</div>'}`}
function render(){stats();navSet();document.getElementById('sideCelebs').innerHTML=celebs.slice(0,4).map(c=>`<div class="celebrity">${avatar(c)}<div style="font-size:13px;font-weight:700">${esc(c.name)}</div><button class="smallbtn" onclick="openChat('${c.id}')">DM</button></div>`).join('');let main=document.getElementById('main');main.innerHTML=state.tab==='feed'?renderFeed():state.tab==='discover'?renderDiscover():state.tab==='dms'?renderDms():state.tab==='stories'?renderStories():state.tab==='events'?renderEvents():renderProfile();navSet();if(state.tab==='dms'&&state.selectedChat){let box=document.getElementById('chatbox');if(box)box.scrollTop=box.scrollHeight}}
function addPost(){let el=document.getElementById('postText'),text=el?.value.trim();if(!text){toast('Schreib erst etwas in deinen Post ✍️');return}let p={id:state.nextId++,author:'you',name:state.myName,text,time:'gerade eben',likes:0,comments:[],liked:false};state.posts.unshift(p);state.followers+=Math.floor(Math.random()*8)+3;state.aura+=8;state.rep+=2;save();render();toast('Post veröffentlicht! +8 Aura ✨')}
function addPhotoMock(){let url=prompt('Füge eine direkte Bild-URL ein (optional):');if(!url)return;if(!/^https?:\/\//i.test(url)){toast('Bitte eine Bild-URL mit https:// eingeben.');return}let text=document.getElementById('postText')?.value.trim()||'photo dump ✨';state.posts.unshift({id:state.nextId++,author:'you',name:state.myName,text,image:url,time:'gerade eben',likes:0,comments:[]});state.aura+=8;state.followers+=4;save();render();toast('Foto-Post veröffentlicht!')}
function likePost(id){let p=allPosts().find(x=>x.id===id);if(!p)return;if(state.likedPosts.includes(id)){state.likedPosts=state.likedPosts.filter(x=>x!==id);state.aura=Math.max(0,state.aura-1);if(p.liked)p.liked=false;else p.likes=Math.max(0,p.likes-1);toast('Like entfernt')}else{state.likedPosts.push(id);if(!p.liked)p.likes=(p.likes||0)+1;state.aura+=2;state.humor+=1;toast('+2 Aura für deine Aktivität!')}save();render()}
function commentPost(id){let txt=prompt('Dein Kommentar:');if(!txt?.trim())return;state.comments[id]=state.comments[id]||((allPosts().find(p=>p.id===id)?.comments)||[]).slice();state.comments[id].push(state.myName+': '+txt.trim());state.aura+=2;state.humor+=1;save();render();toast('Kommentar gepostet! +2 Aura')}
function repost(id){let p=allPosts().find(x=>x.id===id);if(!p)return;state.posts.unshift({id:state.nextId++,author:'you',name:state.myName,text:'🔁 Repost von '+(p.name||getCeleb(p.author).name)+':\n'+p.text,time:'gerade eben',likes:0,comments:[]});state.aura+=3;save();render();toast('Repost geteilt! +3 Aura')}
function toggleFollow(id){if(state.followed.includes(id)){state.followed=state.followed.filter(x=>x!==id);state.followers=Math.max(0,state.followers-1);toast('Du folgst nicht mehr.')}else{state.followed.push(id);state.followers+=Math.floor(Math.random()*12)+4;state.aura+=5;state.rep+=1;toast('Du folgst '+getCeleb(id).name+'! +5 Aura')}save();render()}
function openChat(id){state.tab='dms';state.selectedChat=id;save();render();}
function sendDM(){let input=document.getElementById('dmText'),txt=input?.value.trim();if(!txt)return;let id=state.selectedChat||'olivia';state.messages[id]=state.messages[id]||[];state.messages[id].push({from:'me',text:txt});input.value='';state.aura+=1;save();render();setTimeout(()=>{let c=getCeleb(id);let replies=['haha wait, that’s actually so sweet ✨','omg thank you for telling me 🫶','that sounds like such a vibe honestly','you seem really cool! what else is new?','not me smiling at this message 😭','I love that energy. keep being you 💜'];let reply=replies[Math.floor(Math.random()*replies.length)];state.messages[id].push({from:'them',text:reply});save();if(state.tab==='dms'&&state.selectedChat===id)render();else toast(c.name+' hat geantwortet 💌')},900)}
function makeStory(){let text=prompt('Was soll in deiner Story stehen?');if(!text?.trim())return;state.storySeen=state.storySeen.filter(x=>x!=='you');state.storySeen.push('you');state.posts.unshift({id:state.nextId++,author:'you',name:state.myName,text:'⭕ STORY · '+text.trim(),time:'gerade eben',likes:0,comments:[]});state.aura+=4;save();render();toast('Deine Story ist online! +4 Aura')}
function viewStory(id){state.storySeen=state.storySeen.filter(x=>x!==id);state.storySeen.push(id);save();let c=getCeleb(id);let lines={'olivia':'Studio lights, new melodies and late nights 💜','drew':'Long day, good crew 🎬','jenna':'A quiet day away from the cameras 🖤','sabrina':'sparkles everywhere 💋','central':'studio mode 🎧','billie':'🌙🕷️','tom':'weekend adventures 🕸️','paul':'somewhere on set 🎭'};alert(c.name+' · Story\n\n'+(lines[id]||'behind the scenes ✨')+'\n\n(Fiktive Spiel-Story)');render()}
function joinEvent(id){if(state.joinedEvents.includes(id)){toast('Du bist schon angemeldet!');return}let e=events.find(x=>x.id===id);state.joinedEvents.push(id);state.aura+=e.reward;state.rep+=3;state.followers+=Math.floor(Math.random()*15)+5;save();render();toast('Du bist dabei! +'+e.reward+' Aura 🎟️')}
function editProfile(){let name=prompt('Wie soll dein Fame-Name sein?',state.myName);if(name===null)return;let bio=prompt('Deine Bio:',state.myBio);state.myName=name.trim()||'You';if(bio!==null)state.myBio=bio.trim();save();render();toast('Profil aktualisiert ✨')}
function resetGame(){if(!confirm('Wirklich den ganzen Spielstand zurücksetzen?'))return;localStorage.removeItem('fameGameV1');state={followers:128,aura:42,humor:35,rep:18,posts:[],followed:[],likedPosts:[],joinedEvents:[],messages:{},myName:'You',myBio:'just figuring out this fame thing ✦',nextId:10,tab:'feed',selectedChat:null,comments:{},storySeen:[]};save();render();toast('Neuer Start! ✦')}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));document.getElementById('resetBtn').addEventListener('click',resetGame);load();render();
</script></body></html>
